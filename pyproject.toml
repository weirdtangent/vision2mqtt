[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2mqtt"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "json-logging-graystorm",
    "mqtt-helper-graystorm",
]

[project.scripts]
vision2mqtt = "vision2mqtt.app:main"

[project.optional-dependencies]
ultralytics = [
    "ultralytics>=8.4.116",
]
dev = [
    # linting/formatting
    "black>=26.5.1",
    "ruff>=0.16.2",

    # testing/coverage
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
vision2mqtt = ["VERSION"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision2mqtt*"]

[tool.setuptools_scm]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 160
indent-width = 4

target-version = "py313"

[tool.ruff.lint]
# ruff 0.16.0 broadened its default rule set, newly flagging rules this
# project never opted into. These are intentional or low-value for an MQTT
# bridge (broad exception handling in callback loops, logging style,
# subprocess calls), so keep them out of scope.
ignore = [
    "BLE001",   # blind `except Exception` — intentional in callback/loop handlers
    "S110",     # try-except-pass — intentional best-effort cleanup
    "PLW1510",  # subprocess.run without explicit check
    "PLW1508",  # env var default type
    "G201",     # logging .error(exc_info=True) vs .exception()
    "TRY401",   # redundant exception object in logging.exception
    "LOG015",   # call on root logger
    "PERF102",  # dict .items() when only values used
    "RUF012",   # mutable default for class attribute (no ClassVar)
    "PYI036",   # __aexit__ argument annotations
]

[tool.pyright]
include = [ "src" ]
extraPaths = [ "src" ]
venvPath = "./.venv"
typeCheckingMode = "basic"
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--quiet"
testpaths = "tests"
pythonpath = "src"

[tool.coverage.run]
branch = true
source = ["vision2mqtt"]
omit = [
    "tests/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover"
]

[tool.black]
line-length = 160
target-version = ["py313"]
extend-exclude = '''
/(
  \.venv
 |\.ruff_cache
 |\.pytest_cache
 |node_modules
 |dist
 |build
)/
'''

[tool.uv]
# setuptools is pulled transitively by torch (linux-only) at 81.0.0, which has
# PYSEC-2026-3447. Nothing requests a newer floor, so pin it above the fix here.
constraint-dependencies = ["setuptools>=84.0.0"]

[tool.uv.sources]
json-logging-graystorm = { git = "https://github.com/weirdtangent/json-logging.git", rev = "5e245601ad2da7676a52281345e4040bb0281ffb" }
mqtt-helper-graystorm = { git = "https://github.com/weirdtangent/mqtt-helper.git", rev = "97bb14685fe297ca8bda2af1c8ef4fa2c7566c19" }

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.1",
    "types-pyyaml>=6.0.12.20260724",
    "pip-audit>=2.10.1",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
allow_untyped_globals = false
allow_redefinition = false
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "paho.*",
  "ultralytics.*",
  "axengine.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
